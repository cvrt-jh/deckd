[package]
name = "deckd-core"
version = "0.1.0"
edition = "2021"
description = "Config schema, validation and key layout shared by deckd and the deckd panel firmware"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
num-traits = "0.2"
# No "png-format": core does no file I/O, so the PNG encoder/decoder stays out.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"

# Embedded JetBrains Mono Nerd Font weights, one feature each; at least one
# is required. deckd uses the default (all weights); the panel firmware picks
# the few it needs to fit its flash.
[features]
default = ["all-fonts"]
all-fonts = [
    "font-jb-thin",
    "font-jb-extralight",
    "font-jb-light",
    "font-jb-regular",
    "font-jb-medium",
    "font-jb-semibold",
    "font-jb-bold",
    "font-jb-extrabold",
]
font-jb-thin = []
font-jb-extralight = []
font-jb-light = []
font-jb-regular = []
font-jb-medium = []
font-jb-semibold = []
font-jb-bold = []
font-jb-extrabold = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
