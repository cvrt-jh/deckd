[package]
name = "deckd-core"
version = "0.1.0"
edition = "2021"
description = "Config schema, validation and key layout shared by deckd and the deckd panel firmware"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
num-traits = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
