[toolchain]
# Xtensa Rust 1.93.0.0 (LLVM 20), installed with
#   espup install --toolchain-version 1.93.0.0 --name esp-1.93 --std \
#     --targets esp32s3 --export-file ~/export-esp-1.93.sh
# 1.94.0.2 to 1.98.0.0 (LLVM 21) abort in tiny-skia with "Cannot select
# XtensaISD::PCREL_WRAPPER" (esp-rs/rust#277/#282, espressif/llvm-project#127);
# 1.98.1.0 and later fix that but miscompile bytes of a static's address
# (esp-rs/rust#283, open). Move to plain "esp" once #283 is fixed.
channel = "esp-1.93"
