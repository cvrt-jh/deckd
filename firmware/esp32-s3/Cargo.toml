[package]
name = "deckd-panel"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"
description = "deckd panel firmware for the Waveshare ESP32-S3-Touch-LCD-4 (spike)"
license = "MIT OR Apache-2.0"
publish = false

# Own workspace: the firmware builds for xtensa with the esp toolchain, the
# root workspace for the host.
[workspace]

[[bin]]
name = "deckd-panel"
harness = false # no std test harness on the device

[profile.release]
opt-level = "s"

[profile.dev]
debug = true # symbols do not increase the flashed size
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.54"
# Only the fonts the panel uses; all of them (19 MB) would not fit the flash.
deckd-core = { path = "../../crates/core", default-features = false, features = [
    "font-jb-bold",
    "font-jb-extrabold",
] }
toml = "0.8"

[build-dependencies]
embuild = "0.33"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
